<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document — IACF</title>
<meta name="description" content="IACF — Industry AI Core Framework: agentic AI for smart manufacturing.">
<style>
:root{
  --bg:#0a0f1e; --bg2:#0d1526; --panel:#111c33; --panel2:#0f1930;
  --line:#1e2c4a; --ink:#e8eef9; --sub:#94a7c7; --mut:#64769a;
  --acc:#38bdf8; --acc2:#818cf8; --grad:linear-gradient(92deg,#38bdf8, #818cf8 55%,#c084fc);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
header.site{position:sticky;top:0;z-index:50;background:rgba(10,15,30,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--ink)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:9.5px;letter-spacing:2.6px;color:var(--mut);font-weight:600}
nav.main{display:flex;flex-wrap:wrap;gap:4px 18px}
nav.main a{color:var(--sub);font-size:14px;font-weight:500}
nav.main a:hover{color:var(--ink);text-decoration:none}
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 480px at 85% -10%,rgba(56,189,248,.16),transparent 60%),radial-gradient(700px 420px at 8% 110%,rgba(129,140,248,.14),transparent 60%),var(--bg2);border-bottom:1px solid var(--line)}
.hero-in{max-width:1180px;margin:0 auto;padding:84px 24px 72px}
.kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--acc);border:1px solid rgba(56,189,248,.4);padding:5px 12px;border-radius:999px;margin-bottom:22px}
.hero h1{font-size:52px;line-height:1.08;font-weight:800;letter-spacing:-.5px;max-width:820px}
.hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:20px;font-size:19px;color:var(--sub);max-width:680px}
.cta{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:600;font-size:15.5px;background:var(--grad);color:#06101f}
.btn:hover{text-decoration:none;opacity:.92}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stats{margin-top:52px;display:flex;gap:44px;flex-wrap:wrap}
.stat .n{font-size:27px;font-weight:800}
.stat .l{font-size:12.5px;color:var(--mut);letter-spacing:1.4px;text-transform:uppercase}
section.blk{max-width:1180px;margin:0 auto;padding:64px 24px 8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px}
.sec-head h2{font-size:29px;font-weight:800;letter-spacing:-.3px}
.sec-head a{font-size:14.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-3px);border-color:#2c4470;text-decoration:none}
.card .thumb{height:168px;background:var(--panel2) center/cover no-repeat;border-bottom:1px solid var(--line)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .d{font-size:12.5px;color:var(--acc);font-weight:700;letter-spacing:1.2px}
.card h3{font-size:17.5px;line-height:1.35;color:var(--ink);font-weight:700}
.card p{font-size:14px;color:var(--sub);flex:1}
.card .more{font-size:13.5px;font-weight:600;color:var(--acc)}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.fcard .ic{font-size:26px;margin-bottom:12px}
.fcard h3{font-size:18px;margin-bottom:8px}
.fcard p{font-size:14.5px;color:var(--sub)}
.about{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 32px;font-size:16.5px;color:#c6d3ea}
main.page{max-width:860px;margin:0 auto;padding:44px 24px 64px}
main.page h1{font-size:33px;line-height:1.25;letter-spacing:-.3px;margin-bottom:8px}
.date{color:var(--acc);font-size:13px;font-weight:700;letter-spacing:1.2px;margin-bottom:26px;text-transform:uppercase}
article p{margin:0 0 16px;color:#d5deef}
article h2,article h3,article h4{margin:28px 0 10px;line-height:1.3;color:var(--ink)}
article ul,article ol{margin:0 0 16px 22px;color:#d5deef}
article img{max-width:100%;height:auto;border-radius:10px}
article figure{margin:0 0 18px;color:var(--sub);font-size:13.5px;text-align:center}
article pre{background:#0a1224;border:1px solid var(--line);padding:14px;border-radius:10px;overflow-x:auto;margin-bottom:16px;font-size:13.5px}
article code{background:#0a1224;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.92em}
article pre code{background:none;border:none;padding:0}
article blockquote{border-left:3px solid var(--acc);padding-left:14px;color:var(--sub);margin:0 0 16px}
article table{border-collapse:collapse;margin-bottom:16px}
article td,article th{border:1px solid var(--line);padding:6px 10px}
article a{word-break:break-word}
footer{margin-top:70px;border-top:1px solid var(--line);background:var(--bg2)}
.footer-in{max-width:1180px;margin:0 auto;padding:34px 24px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;color:var(--mut);font-size:13.5px}
@media (max-width:640px){.hero h1{font-size:36px}.hero-in{padding:56px 20px 48px}}
</style>
</head>
