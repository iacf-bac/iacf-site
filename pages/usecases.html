<style>
:root { --ink:#0f172a; --sub:#475569; --accent:#2563eb; --soft:#f1f5f9; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); line-height:1.65; }
header.site { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; padding:18px 5vw; border-bottom:1px solid var(--soft); }
.logo { font-size:24px; font-weight:800; letter-spacing:2px; }
.logo span { color:var(--accent); }
nav.main { display:flex; flex-wrap:wrap; gap:4px 18px; }
nav.main a { color:var(--sub); text-decoration:none; font-size:14.5px; }
nav.main a:hover { color:var(--accent); }
main { max-width:860px; margin:0 auto; padding:36px 5vw 60px; }
main h1 { font-size:32px; line-height:1.25; margin-bottom:8px; }
.date { color:var(--sub); font-size:14px; margin-bottom:24px; }
article p { margin:0 0 16px; }
article h2, article h3, article h4 { margin:26px 0 10px; line-height:1.3; }
article ul, article ol { margin:0 0 16px 22px; }
article img { max-width:100%; height:auto; border-radius:8px; }
article pre { background:var(--soft); padding:14px; border-radius:8px; overflow-x:auto; margin-bottom:16px; font-size:13.5px; }
article code { background:var(--soft); padding:1px 5px; border-radius:4px; font-size:.92em; }
article pre code { background:none; padding:0; }
article blockquote { border-left:3px solid var(--accent); padding-left:14px; color:var(--sub); margin:0 0 16px; }
article table { border-collapse:collapse; margin-bottom:16px; }
article td, article th { border:1px solid #cbd5e1; padding:6px 10px; }
ul.postlist { list-style:none; }
ul.postlist li { padding:12px 0; border-bottom:1px solid var(--soft); }
ul.postlist a { color:var(--ink); text-decoration:none; font-weight:600; }
ul.postlist a:hover { color:var(--accent); }
ul.postlist .d { color:var(--sub); font-size:13.5px; margin-right:10px; }
footer { text-align:center; padding:28px 5vw; border-top:1px solid var(--soft); color:var(--sub); font-size:14px; }
footer a { color:var(--sub); }
</style>
